[plugin]

name="dot-menu"
description="In-game menus as data: pages of rows that are views of dot-settings, the stock audio, video and general settings with the code that applies them, rebindable keys with swap-on-conflict, a help screen, a numbered picker, a HUD layout editor, and whole-palette themes a game, a file or a server can add to or narrow. Depends on dot-core, dot-ui and dot-settings."
author="dot"
version="0.1.0"
script="dot_menu_plugin.gd"
